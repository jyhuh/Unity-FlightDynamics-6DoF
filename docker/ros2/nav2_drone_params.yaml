bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.50
      yaw_goal_tolerance: 3.14
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: -0.3
      min_vel_y: -0.5
      max_vel_x: 1.8
      max_vel_y: 0.8
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 1.8
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 1.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.5
      decel_lim_y: -1.0
      decel_lim_theta: -1.5
      vx_samples: 10
      vy_samples: 5
      vtheta_samples: 10
      sim_time: 1.8
      linear_granularity: 0.1
      angular_granularity: 0.05
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.50
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      critics: ["ObstacleFootprint", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 1.5
      PathAlign.scale: 10.0
      PathAlign.forward_point_distance: 0.3
      GoalAlign.scale: 8.0
      GoalAlign.forward_point_distance: 0.3
      PathDist.scale: 16.0
      GoalDist.scale: 12.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 16
      height: 16
      resolution: 0.2
      robot_radius: 0.55
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 10.0
        min_obstacle_height: -1.0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 10.0
          min_obstacle_height: -1.0
          clearing: true
          marking: true
          inf_is_valid: true
          data_type: "LaserScan"
          raytrace_max_range: 19.5
          raytrace_min_range: 0.3
          obstacle_max_range: 18.0
          obstacle_min_range: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.25
      robot_radius: 0.55
      transform_tolerance: 0.5
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 10.0
        min_obstacle_height: -1.0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 10.0
          min_obstacle_height: -1.0
          clearing: true
          marking: true
          inf_is_valid: true
          data_type: "LaserScan"
          raytrace_max_range: 19.5
          raytrace_min_range: 0.3
          obstacle_max_range: 18.0
          obstacle_min_range: 0.3
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 5
    stop_on_failure: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.8, 0.8, 1.0]
    min_velocity: [-0.3, -0.8, -1.0]
    max_accel: [1.5, 1.0, 1.5]
    max_decel: [-1.5, -1.0, -1.5]
    odom_topic: /odom

